# Every image the lab cluster is allowed to run.
#
# The cluster can pull ONLY from the lab registry, so anything not listed here
# (and mirrored with `labctl lab mirror`) fails with ImagePullBackOff.
#
# ref    - upstream reference with an explicit tag. Pod specs keep using this
#          exact name; containerd on the nodes redirects it to the lab registry.
# digest - upstream digest of that tag (the multi-arch index). `lab mirror`
#          refuses to copy if upstream no longer matches.
# groups - `labctl lab mirror --group <name>` copies one group; default is all.
images:
  - ref: docker.io/library/busybox:1.37.0
    digest: sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    groups: [base]
    why: Workload image for `labctl lab verify` and the failure scenarios.

  # --- kagent (M3). Chart version is pinned in versions.yaml. ---------------
  - ref: ghcr.io/kagent-dev/kagent/controller:0.10.7
    digest: sha256:5a96e98c4a86baa34490378b5feee5f22d22ac20ad615678711b2a30eb240860
    groups: [kagent]
    why: kagent controller (API, A2A endpoint, reconciles Agent resources).
  - ref: ghcr.io/kagent-dev/kagent/ui:0.10.7
    digest: sha256:34f2119254a25a92b4e9431d6579443155ad595acf678bd1a58955f3084d93a6
    groups: [kagent]
    why: kagent web UI, used to read agent sessions by hand.
  - ref: ghcr.io/kagent-dev/kagent/golang-adk:0.10.7
    digest: sha256:d33881e750c75026e11b04cf84a4f172a16eacd9304ff871142c9d99fb026965
    groups: [kagent]
    why: Agent runtime image. The controller starts one Deployment per Agent with it (runtime "go", the CRD default).
  - ref: ghcr.io/kagent-dev/kagent/tools:0.3.2
    digest: sha256:93d24e2686abdffb5acf5bf5767e421637bb9b0e81779d1524d473bf89005a91
    groups: [kagent]
    why: Built-in MCP tool server (kagent-tools sub-chart 0.3.2) with the Kubernetes tools.
  - ref: docker.io/library/postgres:18.6-alpine3.23
    digest: sha256:f1031bf693d8d60b0a0380c51a3510607c7a93c7c1d18bf7af94a3a8dbeb40b8
    groups: [kagent]
    why: PostgreSQL bundled with the kagent chart (sessions and tasks).