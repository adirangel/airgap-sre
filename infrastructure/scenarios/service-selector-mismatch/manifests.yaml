apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-frontend
  labels:
    app: shop-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop-frontend
  template:
    metadata:
      labels:
        app: shop-frontend
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0
          command:
            - sh
            - -c
            - |
              mkdir -p /www && echo "storefront ok" > /www/index.html
              exec httpd -f -p 8080 -h /www
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
spec:
  # The fault: the pods are labelled app=shop-frontend.
  selector:
    app: shop-front
  ports:
    - port: 80
      targetPort: 8080