apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-config
data:
  DB_HOST: orders-db.internal
  # The fault: a port must be a number.
  DB_PORT: "5432a"
  LOG_LEVEL: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  labels:
    app: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: checkout
          image: docker.io/library/busybox:1.37.0
          envFrom:
            - configMapRef:
                name: checkout-config
          command:
            - sh
            - -c
            - |
              echo "checkout starting; db=${DB_HOST}:${DB_PORT} log=${LOG_LEVEL}"
              case "${DB_PORT}" in
                ''|*[!0-9]*)
                  echo "FATAL: invalid configuration: DB_PORT='${DB_PORT}' is not a valid port number" >&2
                  exit 1
                  ;;
              esac
              echo "checkout ready"
              while true; do sleep 3600; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi