apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-worker
  labels:
    app: batch-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch-worker
  template:
    metadata:
      labels:
        app: batch-worker
    spec:
      terminationGracePeriodSeconds: 1
      # The fault: no node carries this label.
      nodeSelector:
        disktype: ssd
      containers:
        - name: worker
          image: docker.io/library/busybox:1.37.0
          command: ["sh", "-c", "echo batch-worker ready; while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi