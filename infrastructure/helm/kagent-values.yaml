# Helm values for the kagent chart (version pinned in ../versions.yaml).
# Minimal install for the M3 baseline: controller, UI, built-in tool server
# and the bundled PostgreSQL. No bundled agents, no kmcp, no Grafana MCP.
#
# Image registries are NOT overridden here on purpose. Pod specs keep their
# upstream names (ghcr.io/..., docker.io/...) and containerd on the node
# redirects every pull to the lab registry. Every image this chart runs must
# be listed in ../images.yaml (group "kagent"); `labctl agent install` refuses
# to start while one of them is missing from the lab registry.

# The model is configured in exactly one place: agents/modelconfig.yaml.
# Setting providers to null stops the chart from creating its own default
# ModelConfig and API-key Secret.
providers: null

# Built-in tool server: Kubernetes tools only, and read-only RBAC
# (get/list/watch) instead of cluster-admin. Secrets stay unreadable.
kagent-tools:
  enabled: true
  rbac:
    readOnly: true
    allowSecrets: false
  tools:
    enabledTools:
      - k8s

# Sub-charts we do not use.
kmcp:
  enabled: false
grafana-mcp:
  enabled: false

# Bundled agents: all off. Our one agent lives in agents/.
k8s-agent:
  enabled: false
kgateway-agent:
  enabled: false
istio-agent:
  enabled: false
promql-agent:
  enabled: false
observability-agent:
  enabled: false
argo-rollouts-agent:
  enabled: false
helm-agent:
  enabled: false
cilium-policy-agent:
  enabled: false
cilium-manager-agent:
  enabled: false
cilium-debug-agent:
  enabled: false

# Extra read-only RBAC for the built-in tool server.
#
# The chart's read-only role (kagent-tools-read-role) covers namespaced
# workloads but not nodes, EndpointSlices, quotas or storage objects. The
# first eval run showed the cost: on the "Pending pod" scenario every
# `get node` call failed with Forbidden, so the agent could not check node
# labels. These rules are get/list/watch only, and Secrets stay unreadable.
extraObjects:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: airgap-sre-tools-extra-read
    rules:
      - apiGroups: [""]
        resources: [nodes, persistentvolumes, resourcequotas, limitranges]
        verbs: [get, list, watch]
      - apiGroups: [discovery.k8s.io]
        resources: [endpointslices]
        verbs: [get, list, watch]
      - apiGroups: [storage.k8s.io]
        resources: [storageclasses]
        verbs: [get, list, watch]
      - apiGroups: [policy]
        resources: [poddisruptionbudgets]
        verbs: [get, list, watch]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: airgap-sre-tools-extra-read
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: airgap-sre-tools-extra-read
    subjects:
      - kind: ServiceAccount
        name: kagent-tools
        namespace: kagent