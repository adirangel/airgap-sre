# The baseline SRE agent: one declarative kagent Agent that uses only kagent's
# built-in, read-only Kubernetes tools.
#
# - Model: agents/modelconfig.yaml (ModelConfig "sre-model").
# - System prompt: agents/prompts/sre-agent.md, loaded by `labctl agent
#   install` into the ConfigMap "sre-agent-prompt".
# - Tools: served by the RemoteMCPServer "kagent-tool-server" that the kagent
#   chart creates. Only read tools are listed, and the tool server itself runs
#   with read-only RBAC (see infrastructure/helm/kagent-values.yaml).
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: sre-agent
  namespace: kagent
spec:
  type: Declarative
  description: Read-only Kubernetes SRE agent. Given a symptom, it investigates the cluster and names the root cause.
  declarative:
    runtime: go
    modelConfig: sre-model
    stream: false
    systemMessageFrom:
      type: ConfigMap
      name: sre-agent-prompt
      key: prompt.md
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: kagent-tool-server
          toolNames:
            - k8s_get_resources
            - k8s_describe_resource
            - k8s_get_resource_yaml
            - k8s_get_pod_logs
            - k8s_get_events
            - k8s_get_available_api_resources
